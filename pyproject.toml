[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wpyls"          # package name (must be unique on PyPI if published)
version = "0.1.0"
description = "My custom ls command in Python for Windows"
authors = [{ name = "Aman Verma (Kiri)" }]
requires-python = ">=3.8"
dependencies = [
"rich",
]
[project.scripts]
wpyls = "wpyls:main_cli"
